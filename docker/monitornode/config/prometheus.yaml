global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cryptosim'
    static_configs:
      - targets: ['host.docker.internal:9090']
    scrape_interval: 5s

  - job_name: 'pebblesim'
    static_configs:
      - targets: ['host.docker.internal:9099']
    scrape_interval: 5s

  # Host CPU, memory, disk, filesystem. Start with start-node-exporter.sh (Linux only).
  - job_name: 'node'
    static_configs:
      - targets: ['host.docker.internal:9100']
    scrape_interval: 5s
