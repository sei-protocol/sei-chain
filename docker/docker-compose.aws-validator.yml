services:
  node:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    container_name: sei-node-${ID:-0}
    image: "sei-chain/localnode"
    user: "${USERID}:${GROUPID}"
    ports:
      - "26656:26656"
      - "8545:8545"
      - "26660:26660"
    environment:
      - ID=${ID:-0}
      - CLUSTER_SIZE=4
      - ADVERTISE_IP
      - AUTOBAHN_E2E_PHASE
      - NUM_ACCOUNTS
      - SKIP_BUILD
      - INVARIANT_CHECK_INTERVAL
      - UPGRADE_VERSION_LIST
      - MOCK_BALANCES
      - GIGA_EXECUTOR
      - GIGA_OCC
      - RECEIPT_BACKEND
      - AUTOBAHN
      - AUTOBAHN_EVMONLY
      - GIGA_STORAGE
      - GIGA_MIGRATE_FROM_MEMIAVL
      - GIGA_FLATKV_ONLY
      - GOCACHE=/tmp/go-cache
      - GOMODCACHE=/tmp/go-mod
    volumes:
      - "${PROJECT_HOME}:/sei-protocol/sei-chain:Z"
      - "${PROJECT_HOME}/../sei-tendermint:/sei-protocol/sei-tendermint:Z"
      - "${PROJECT_HOME}/../sei-cosmos:/sei-protocol/sei-cosmos:Z"
      - "${PROJECT_HOME}/../sei-db:/sei-protocol/sei-db:Z"
      - "${PROJECT_HOME}/../go-ethereum:/sei-protocol/go-ethereum:Z"
      - "${VALIDATOR_HOME}:/root/.sei:Z"
