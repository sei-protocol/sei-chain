# sei-load CLOB bench. Replace __NAMESPACE__, __CHAIN_ID__, __RUN_ID__ (lowercase) and __COMMIT__, then add the live
# committee's shardRouting with add_shard_routing.py before applying. The sei-load image is built from
# sei-load branch yzang/clob-fixed-markets (b2faf076).
apiVersion: v1
kind: ConfigMap
metadata:
  name: seiload-profile-__RUN_ID__
  namespace: __NAMESPACE__
  labels: {app.kubernetes.io/name: seiload, sei.io/chain-id: __CHAIN_ID__, sei.io/bench-name: __RUN_ID__}
data:
  profile.json: |
    {
      "chainId": 713715,
      "seiChainID": "__CHAIN_ID__",
      "endpoints": [
        "ws://__CHAIN_ID__-0-0.__CHAIN_ID__-0.__NAMESPACE__.svc.cluster.local:8546",
        "ws://__CHAIN_ID__-1-0.__CHAIN_ID__-1.__NAMESPACE__.svc.cluster.local:8546",
        "ws://__CHAIN_ID__-2-0.__CHAIN_ID__-2.__NAMESPACE__.svc.cluster.local:8546",
        "ws://__CHAIN_ID__-3-0.__CHAIN_ID__-3.__NAMESPACE__.svc.cluster.local:8546",
        "ws://__CHAIN_ID__-4-0.__CHAIN_ID__-4.__NAMESPACE__.svc.cluster.local:8546",
        "ws://__CHAIN_ID__-5-0.__CHAIN_ID__-5.__NAMESPACE__.svc.cluster.local:8546",
        "ws://__CHAIN_ID__-6-0.__CHAIN_ID__-6.__NAMESPACE__.svc.cluster.local:8546",
        "ws://__CHAIN_ID__-7-0.__CHAIN_ID__-7.__NAMESPACE__.svc.cluster.local:8546"
      ],
      "accounts": {
        "count": 400000,
        "disjoint": true
      },
      "scenarios": [
        {
          "name": "clob",
          "weight": 1,
          "markets": 50000,
          "forceDeploy": true
        }
      ],
      "settings": {
        "reportPath": "/dev/stdout",
        "gasFeeCapFallbackWei": "20000000000",
        "trackReceipts": false,
        "trackBlocks": false,
        "prewarm": false
      }
    }
---
# Eight sei-load pods placing CLOB orders over 50,000 fixed markets, 12,500 tx/s each (100k offered).
apiVersion: batch/v1
kind: Job
metadata:
  name: seiload-__RUN_ID__
  namespace: __NAMESPACE__
  labels: {app.kubernetes.io/name: seiload, sei.io/chain-id: __CHAIN_ID__, sei.io/bench-name: __RUN_ID__}
spec:
  parallelism: 8
  completions: 8
  completionMode: Indexed
  backoffLimitPerIndex: 10
  maxFailedIndexes: 7
  activeDeadlineSeconds: 3000
  template:
    metadata:
      labels: {app.kubernetes.io/name: seiload, sei.io/chain-id: __CHAIN_ID__, sei.io/bench-name: __RUN_ID__}
    spec:
      serviceAccountName: engineer-service-account
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      shareProcessNamespace: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: ["amd64"]}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {sei.io/bench-name: __RUN_ID__}
      volumes:
        - name: profile
          configMap: {name: seiload-profile-__RUN_ID__}
      containers:
        - name: seiload
          image: ghcr.io/sei-protocol/sei-load:sha-b2faf076774402e14ee83d62347ca78bf9fe1b1e
          args: [--config, /etc/seiload/profile.json, --duration=30m, --tps=12500, --max-in-flight=24000, --post-summary-flush-delay=45s, --track-receipts=false]
          env:
            - {name: SEILOAD_RUN_ID, value: "__RUN_ID__"}
            - {name: SEILOAD_CHAIN_ID, value: "__CHAIN_ID__"}
            - {name: SEILOAD_COMMIT_ID, value: "__COMMIT__"}
            - {name: SEILOAD_WORKLOAD, value: engineer}
            - {name: GOMAXPROCS, value: "14"}
          ports: [{name: metrics, containerPort: 9090, protocol: TCP}]
          volumeMounts: [{name: profile, mountPath: /etc/seiload, readOnly: true}]
          resources: {requests: {cpu: "5", memory: 2Gi}, limits: {memory: 6Gi}}
        - name: upload-results
          image: amazon/aws-cli:2.17.43
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -uo pipefail
              running() { grep -q '^seiload$' /proc/[0-9]*/comm 2>/dev/null; }
              APPEAR=$((SECONDS + 60))
              until running; do [ "$SECONDS" -ge "$APPEAR" ] && break; sleep 1; done
              MAX=2340; E=0
              while running; do [ "$E" -ge "$MAX" ] && break; sleep 5; E=$((E + 5)); done
              sleep 2
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              curl -sS --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" \
                "https://kubernetes.default.svc/api/v1/namespaces/$(cat $SA/namespace)/pods/$POD_NAME/log?container=seiload" \
                > /tmp/report.log
              aws s3 cp /tmp/report.log "s3://$S3_BUCKET/$S3_PREFIX/$POD_NAME/report.log"
          env:
            - {name: S3_BUCKET, value: harbor-validation-results}
            - {name: S3_PREFIX, value: __NAMESPACE__/clob/__RUN_ID__}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources: {requests: {cpu: "100m", memory: "128Mi"}, limits: {cpu: "500m", memory: "256Mi"}}
