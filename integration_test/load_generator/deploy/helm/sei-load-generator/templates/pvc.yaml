{{- $root := . -}}
{{- $seen := dict -}}
{{- range .Values.fixtures.sets }}
{{- $name := required "every fixture set requires a name" .name -}}
{{- if hasKey $seen $name -}}
  {{- fail (printf "fixture set name %s is duplicated" $name) -}}
{{- end -}}
{{- $_ := set $seen $name true -}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sei-load-generator.fixtureClaimName" (dict "root" $root "set" $name) }}
  labels:
    app.kubernetes.io/name: {{ include "sei-load-generator.name" $root }}
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    sei.io/fixture-set: {{ $name | quote }}
spec:
  accessModes:
    {{- toYaml (default $root.Values.fixtures.accessModes .accessModes) | nindent 4 }}
  {{- $storageClassName := default $root.Values.fixtures.storageClassName .storageClassName }}
  {{- if $storageClassName }}
  storageClassName: {{ $storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ default $root.Values.fixtures.storageSize .storageSize }}
{{ end }}
