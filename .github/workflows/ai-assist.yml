name: AI Assistant
on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]
jobs:
  assistant:
    # Try: https://github.com/sei-protocol/uci/pull/57
    uses: sei-protocol/uci/.github/workflows/ai-assistant.yml@4e185777f32ea1651f28629d98b6a9cf79678988
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      # Try: https://github.com/sei-protocol/uci/pull/57
      uci-ref: 4e185777f32ea1651f28629d98b6a9cf79678988
      allowed-team: 'sei-protocol/sei-core'
