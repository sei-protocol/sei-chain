name: AI Assistant
on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
jobs:
  assistant:
    # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.21
    uses: sei-protocol/uci/.github/workflows/ai-assistant.yml@93ebad0186c8b71a4036fd0915ffe2ec44283d4b
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.21
      uci-ref: 93ebad0186c8b71a4036fd0915ffe2ec44283d4b
      allowed-team: 'sei-protocol/sei-core'
