name: AI Assistant
on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]
jobs:
  assistant:
    # Try: https://github.com/sei-protocol/uci/pull/57
    uses: sei-protocol/uci/.github/workflows/ai-assistant.yml@7acdc7cf0a14dddf7bc473dfd14150cec2f348ef
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      # Try: https://github.com/sei-protocol/uci/pull/57
      uci-ref: 7acdc7cf0a14dddf7bc473dfd14150cec2f348ef
      allowed-team: 'sei-protocol/sei-core'
