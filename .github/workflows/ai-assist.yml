name: AI Assistant
on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
jobs:
  assistant:
    # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.27
    uses: sei-protocol/uci/.github/workflows/ai-assistant.yml@a3e422db031508ff0b2adf2e66e5a2860a8858e2
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.27
      uci-ref: a3e422db031508ff0b2adf2e66e5a2860a8858e2
      allowed-team: 'sei-protocol/sei-core'
