name: ETH Blocktests

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main
      - release/**
  merge_group:
    branches:
      - main
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
 run:
  shell: bash

env:
  TOTAL_RUNNERS: 5
  EEST_RELEASE: tests@v21.0.2
  EEST_SHA256: e2fa7ea2ea516459f9ab92284b2927892f318f4e1f78ca802cb05a6c3b479ed9

jobs:
  runner-indexes:
    runs-on: ubuntu-latest
    name: Generate runner indexes
    outputs:
      json: ${{ steps.generate-index-list.outputs.json }}
    steps:
      - id: generate-index-list
        run: |
          MAX_INDEX=$((${{ env.TOTAL_RUNNERS }}-1))
          INDEX_LIST=$(seq 0 ${MAX_INDEX})
          INDEX_JSON=$(jq --null-input --compact-output '. |= [inputs]' <<< ${INDEX_LIST})
          echo "json=${INDEX_JSON}" >> $GITHUB_OUTPUT

  eth-blocktests:
    name: "Run ETH Blocktests ${{ matrix.runner-index }}"
    runs-on: ubuntu-latest
    needs: runner-indexes
    strategy:
      fail-fast: false
      matrix:
        # generate runner index array from 0 to total-runners
        runner-index: ${{fromJson(needs.runner-indexes.outputs.json)}}
    steps:
      # See: https://github.com/actions/checkout/releases/tag/v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'

      - name: Cache EEST fixtures
        id: eest-cache
        uses: actions/cache@v4
        with:
          path: eest/fixtures/blockchain_tests/for_osaka
          key: eest-osaka-${{ env.EEST_RELEASE }}

      - name: Download EEST fixtures
        if: steps.eest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p eest
          curl -fsSL -o eest/fixtures.tar.gz \
            "https://github.com/ethereum/execution-specs/releases/download/${EEST_RELEASE/@/%40}/fixtures.tar.gz"
          echo "${EEST_SHA256}  eest/fixtures.tar.gz" | sha256sum -c -
          tar -xzf eest/fixtures.tar.gz -C eest fixtures/blockchain_tests/for_osaka
          rm eest/fixtures.tar.gz

      - name: "Run ETH Blocktest"
        run: ./run_blocktests.sh ./eest/fixtures/blockchain_tests/for_osaka ${{ matrix.runner-index }} ${{ env.TOTAL_RUNNERS }}
