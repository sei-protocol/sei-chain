# seidroid review v2, in shadow beside seidroid.yml: it reviews the same pull
# requests and reports only on its own "Seidroid Review" check, so the two can
# be compared before either is retired.
name: seidroid review v2

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  seidroid:
    uses: sei-protocol/seidroid/.github/workflows/review.yml@42d2eedb177c8fe4bfd8ba3c4f53dc2e2f805d66 # v0.3.1
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      # Runs the full v2 review (scouts, main review, sandboxed shell) on the same
      # triggers as seidroid.yml, but publishes only its Seidroid Review check: no
      # review, inline comments, approval, reactions or replies. v1 keeps the
      # conversation, and the service pairs this check with v1's on each commit.
      shadow: true
      allowed-bots: seidroid[bot]
