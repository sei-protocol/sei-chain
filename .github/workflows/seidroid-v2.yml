# seidroid review v2, in shadow beside seidroid.yml: it reviews the same pull
# requests and reports only on its own "Seidroid Review" check, so the two can
# be compared before either is retired.
name: seidroid review v2

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  seidroid:
    uses: sei-protocol/seidroid/.github/workflows/review.yml@5d334471bb132a49195364a011b67185484b6333 # main with OpenAI workload identity
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      shadow: true
      allowed-bots: seidroid[bot]
