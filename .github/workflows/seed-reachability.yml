name: Seed Reachability
run-name: Seed Reachability / published seeds serve P2P

# Dials the published Sei Labs seed endpoints and asserts each one actually
# speaks P2P, rather than merely accepting the TCP connection. Seed mode
# publishes no Prometheus metrics and the pods report Ready while serving
# nothing, so this is the only signal that would catch a seed going dark.
#
# Manual for now. It talks to live external infrastructure, so it is not a PR
# gate: a seed hiccup or CI egress trouble must not block unrelated work. The
# scheduled trigger is added once every published seed is serving, so its first
# automated run is green rather than red.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reachability:
    name: Reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Compile-checked as well as run: build-tagged files are skipped by the
      # untagged vet and by golangci-lint, so without this the package can rot
      # against an API change and stay green.
      - name: Vet
        run: go vet -tags=integration ./app/seeds/...

      - name: Seed reachability
        run: go test -tags=integration -v -count=1 -timeout=5m ./app/seeds/...
