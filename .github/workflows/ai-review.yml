name: AI Review
on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]
jobs:
  ai-review:
    # Test: https://github.com/sei-protocol/uci/pull/58
    uses: sei-protocol/uci/.github/workflows/ai-review.yml@5951f951bd7a1d533aaa92f4f51ce17a3ae6eee5
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    secrets: inherit
    with:
      # Test: https://github.com/sei-protocol/uci/pull/58
      uci-ref: 5951f951bd7a1d533aaa92f4f51ce17a3ae6eee5
      enable-cursor: false # Disabled for now since there is a dedicated Bugbot flow built into Cursor currently enabled on repo.
