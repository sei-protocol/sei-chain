name: AI Review
on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]
jobs:
  ai-review:
    # Try: https://github.com/sei-protocol/uci/pull/56
    uses: sei-protocol/uci/.github/workflows/ai-review.yml@masih/uci-review-comment-refinement
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    secrets: inherit
    with:
      # Try: https://github.com/sei-protocol/uci/pull/56
      uci-ref: masih/uci-review-comment-refinement
      enable-cursor: false # Disabled for now since there is a dedicated Bugbot flow built into Cursor currently enabled on repo.
