name: AI Review
on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened, labeled, unlabeled ]
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]
jobs:
  ai-review:
    # Try: https://github.com/sei-protocol/uci/pull/57
    uses: sei-protocol/uci/.github/workflows/ai-review.yml@7acdc7cf0a14dddf7bc473dfd14150cec2f348ef
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    secrets: inherit
    with:
      # Try: https://github.com/sei-protocol/uci/pull/57
      uci-ref: 7acdc7cf0a14dddf7bc473dfd14150cec2f348ef
      enable-cursor: false # Disabled for now since there is a dedicated Bugbot flow built into Cursor currently enabled on repo.
