name: AI Review
on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]
jobs:
  ai-review:
    # See: https://github.com/sei-protocol/uci/pull/59
    uses: sei-protocol/uci/.github/workflows/ai-review.yml@c845bc43dd0e7aa9ca1a3d69524261911c322aff
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    secrets: inherit
    with:
      # See: https://github.com/sei-protocol/uci/pull/59
      uci-ref: c845bc43dd0e7aa9ca1a3d69524261911c322aff
      enable-cursor: false # Disabled for now since there is a dedicated Bugbot flow built into Cursor currently enabled on repo.
      re-review-on-push: true