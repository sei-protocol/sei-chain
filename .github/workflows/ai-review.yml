name: AI Review
on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
jobs:
  ai-review:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.21
    uses: sei-protocol/uci/.github/workflows/ai-review.yml@93ebad0186c8b71a4036fd0915ffe2ec44283d4b
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    secrets: inherit
    with:
      # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.21
      uci-ref: 93ebad0186c8b71a4036fd0915ffe2ec44283d4b
      allowed-team: 'sei-protocol/sei-core'
      allowed-bots: '["seidroid[bot]"]' # To allow AI review on automatically backported PRs.
      enable-cursor: false # Disabled for now since there is a dedicated Bugbot flow built into Cursor currently enabled on repo.
