name: AI Review
on:
  pull_request:
    types: [ opened, ready_for_review, synchronize, reopened ]
jobs:
  ai-review:
    # See: https://github.com/sei-protocol/uci/pull/59
    uses: sei-protocol/uci/.github/workflows/ai-review.yml@6a1c0dd1fd625c187cd1911009bdfe5a13f6c19a
    permissions:
      contents: read
      pull-requests: write
      checks: write
      id-token: write
    secrets: inherit
    with:
      # See: https://github.com/sei-protocol/uci/pull/59
      uci-ref: 6a1c0dd1fd625c187cd1911009bdfe5a13f6c19a
      enable-cursor: false # Disabled for now since there is a dedicated Bugbot flow built into Cursor currently enabled on repo.
