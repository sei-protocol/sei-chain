# Seidroid Shadow, the next generation of seidroid review, running beside
# seidroid.yml: it reviews the same pull requests and reports only on its own
# "Seidroid Review" check, so the two can be compared before either is retired.
name: Seidroid Shadow

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  seidroid:
    # A pull_request run from a fork gets no OIDC token, which the review needs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: sei-protocol/seidroid/.github/workflows/review.yml@3c6ba95e06b0be962e2b14bbfed5b15734627cc8 # v0.3.4
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    with:
      # Runs the full seidroid app review (scouts, main review, sandboxed shell) on the same
      # triggers as seidroid.yml, but publishes only its Seidroid Review check: no
      # review, inline comments, approval, reactions or replies. v1 keeps the
      # conversation, and the service pairs this check with v1's on each commit.
      shadow: true
      allowed-bots: seidroid[bot]
      # The review's shell has no network, so Go at go.mod's version and the modules are
      # fetched into its home first.
      prepare: >-
        v=$(awk '$1 == "go" {print $2; exit}' go.mod) &&
        mkdir -p ~/sdk &&
        { ~/sdk/go/bin/go version 2>/dev/null | grep -qF "go$v " ||
        { f=go$v.linux-$(dpkg --print-architecture).tar.gz &&
        rm -rf ~/sdk/go &&
        curl --proto '=https' --tlsv1.2 -fsSLo ~/sdk/$f "https://dl.google.com/go/$f" &&
        echo "$(curl --proto '=https' --tlsv1.2 -fsSL "https://dl.google.com/go/$f.sha256")  $HOME/sdk/$f" | sha256sum -c --quiet &&
        tar -xzf ~/sdk/$f -C ~/sdk && rm ~/sdk/$f; }; } &&
        GOTOOLCHAIN=local ~/sdk/go/bin/go mod download
      extra-instructions: >-
        Go is in ~/sdk/go/bin, which is not on PATH, and the modules are already
        downloaded, as there is no network; run
        `export PATH="$HOME/sdk/go/bin:$PATH" GOPROXY=off GOTOOLCHAIN=local` before using go.
        Use it to settle what reading cannot, one package at a time and narrowed with -run,
        such as `go test -count=1 -run 'TestName' ./x/evm/keeper`.
        When the diff adds or changes a field, a JSON tag, a default or a constant of something
        that is serialised, hashed or written to disk, the tests that catch it are often far
        from the change: list every test file in the repository that uses the type, such as
        `grep -rlw TypeName --include='*_test.go' .`, and run the ones that compare against an
        expected digest, hash, golden file or fixture.
        Never run `./...` or a whole module, and leave -race, the integration and e2e suites
        and lint to CI: the first build of a package can take minutes.
