name: sei-db
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - release/**

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}

# TODO: we should combine these tests into go-test at some point.

jobs:
  tests-rocksdb:
    name: RocksDB Tests
    # Pinned for the RocksDB version: ubuntu-24.04's librocksdb-dev is 8.9.1.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      # See: https://github.com/actions/checkout/releases/tag/v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install RocksDB
        run: |
          bash .github/scripts/ci-drop-third-party-apt-sources.sh
          sudo apt-get update
          # 8.9.x is the RocksDB the grocksdb v1.8.x binding in go.mod targets;
          # the glob takes Ubuntu's patch revisions but fails on a version change.
          sudo apt-get install -y 'librocksdb-dev=8.9.1-*'

      - name: Run RocksDB Tests
        run: go test -v -mod=readonly -tags=rocksdbBackend ./sei-db/db_engine/rocksdb/... -covermode=atomic -coverprofile=./rdb-profile.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./rdb-profile.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: sei-db
          disable_search: true
          name: sei-db-coverage
