name: Sei-DB
on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - release/**

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}

env:
  GO_VERSION: '1.27.1'
  GO_TEST_TIMEOUT: 30m
  STATE_DB_PKG_PREFIX: github.com/sei-protocol/sei-chain/sei-db/state_db

jobs:
  test:
    name: Race Detection
    runs-on: uci-default
    env:
      GOFLAGS: -race -tags=ledger,test_ledger_mock
    steps:
      # See: https://github.com/actions/checkout/releases/tag/v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Login to Docker Hub
        # See: https://github.com/docker/login-action/releases/tag/v4.2.0
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download modules
        run: go mod download

      - name: Go test
        run: |
          # Build covdata into the cache once. Packages without tests run it in
          # parallel, and on a cold cache one run can exec it while another is
          # still writing it ("text file busy").
          go tool -n covdata > /dev/null
          go test \
            -timeout=${{ env.GO_TEST_TIMEOUT }} \
            -coverprofile=coverage.out \
            ./sei-db/state_db/...

      - name: Upload coverage to Codecov
        if: github.event_name != 'merge_group'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          disable_search: 'true'
          name: sei-db-state-db-coverage
          files: ./coverage.out
          flags: sei-db-state-db

      # The run above compiles the benchmarks but never executes them, so a
      # benchmark can stop running without failing anything. One iteration each
      # is enough to catch that; the timings it prints are not measurements.
      # Runs without -race, which the job-level GOFLAGS would otherwise apply.
      - name: Benchmark smoke
        env:
          GOFLAGS: -tags=ledger,test_ledger_mock
        run: |
          go test \
            -timeout=${{ env.GO_TEST_TIMEOUT }} \
            -run '^$' \
            -bench . \
            -benchtime=1x \
            ./sei-db/bench/...
