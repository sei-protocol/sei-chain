syntax = "proto3";

package p2p.giga;

import "autobahn/autobahn.proto";
import "wireguard/wireguard.proto";

option go_package = "github.com/sei-protocol/sei-chain/sei-tendermint/internal/p2p/giga/pb";

message ConsensusResp {
  option (wireguard.sized) = true;
}

message PingReq {
  option (wireguard.sized) = true;
}

message PingResp {
  option (wireguard.sized) = true;
}

message LaneVote {
  option (wireguard.sized) = true;
  reserved "lane_vote", "lane_vote_v2";
  reserved 1, 2;
  autobahn.SignedLaneBlockHeader lane_vote_v3 = 3;
}

message LaneProposal {
  option (wireguard.sized) = true;
  reserved "lane_proposal", "lane_proposal_v2";
  reserved 1, 2;
  autobahn.SignedLaneBlock lane_proposal_v3 = 3;
}

message AppVote {
  option (wireguard.sized) = true;
  reserved "app_vote";
  reserved 1;
  autobahn.SignedAppVote app_vote_v2 = 2;
}

message StreamLaneProposalsReq {
  reserved "first_block_number";
  reserved 1;
  option (wireguard.sized) = true;
  uint64 first_height = 3;
  optional autobahn.LaneID lane_id = 2; // required
}

message StreamCommitQCsReq {
  option (wireguard.sized) = true;
}

message StreamLaneVotesReq {
  option (wireguard.sized) = true;
}

message StreamAppVotesReq {
  option (wireguard.sized) = true;
}

message GetBlockReq {
  option (wireguard.sized) = true;
  reserved 1;
  reserved "global_number";
  optional autobahn.LaneBlockPos pos = 2; // required
}

message GetBlockResp {
  reserved "block";
  reserved 1;
  option (wireguard.sized) = true;
  optional autobahn.LaneBlock block_v2 = 2;
}

message StreamFullCommitQCsReq {
  option (wireguard.sized) = true;
  uint64 next_block = 1;
}

message StreamAppQCsReq {
  option (wireguard.sized) = true;
  uint64 next_block = 1;
}
