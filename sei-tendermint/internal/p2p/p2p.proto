syntax = "proto3";

package p2p;

import "wireguard/wireguard.proto";

option go_package = "github.com/sei-protocol/sei-chain/sei-tendermint/internal/p2p/pb";

message PacketPing {}

message PacketPong {}

message PacketMsg {
  int32 channel_id = 1;
  bool eof = 2;
  bytes data = 3;
}

message Packet {
  oneof sum {
    PacketPing packet_ping = 1;
    PacketPong packet_pong = 2;
    PacketMsg packet_msg = 3;
  }
}

message NodePublicKey {
  option (wireguard.sized) = true;
  bytes ed25519 = 1 [(wireguard.max_size) = 32];
  reserved 2, 3;
  reserved "secp256k1", "sr25519";
}

message Preface {
  // ephemeral curve25519 key for Diffie-Hellman secret sharing.
  bytes sts_public_key = 1;
}

message Handshake {
  option (wireguard.sized) = true;
  // Node signature on the encrypted session challenge
  // derived from the secret. It authenticates the node.
  NodePublicKey node_auth_key = 1;
  bytes node_auth_sig = 2 [(wireguard.max_size) = 64];
  // NodeAddress that this peer can be dialed at.
  // 320 fits the longest NodeAddress: "mconn://" + 40-hex node ID + "@" + a
  // 253-char DNS name + ":" + a 5-digit port.
  optional string self_addr = 4 [(wireguard.max_size) = 320];
  // Initial peer exchange.
  // It allows to receive peer addresses from a node which doesn't accept any new inbound connections
  // (it is at full capacity).
  repeated string pex_addrs = 5 [
    (wireguard.max_count) = 100,
    (wireguard.max_size) = 320
  ];

  bool sei_giga_connection = 3;

  // Autobahn committee claim. decodeGigaClaim requires all three or none.
  optional bytes validator_auth_key = 6 [(wireguard.max_size) = 32];
  optional bytes validator_auth_sig = 7 [(wireguard.max_size) = 64];
  optional string evm_rpc = 8 [(wireguard.max_size) = 2048];
}
