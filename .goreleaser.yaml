version: 2

project_name: sei-chain

before:
  hooks:
    - go mod download
    # The release runner is amd64, so building linux/arm64 needs binfmt registered.
    # Pinned by digest: this runs privileged on the release runner, which holds the
    # credentials that publish the binaries.
    - docker run --privileged --rm tonistiigi/binfmt:qemu-v8.1.5@sha256:2d2918e86e5327d0661f7083d67a95280b0f7be8f77ed79a8418f81d7d90ce6f --install arm64
    # build-static.sh self-verifies per architecture (libwasmvm archives present, pinned
    # libgcc checksums match, output is static, no gcc>=12 b-tree unwinder).
    - bash scripts/build-static.sh amd64
    - bash scripts/build-static.sh arm64
    # Boot the binary before packaging: catches crash-at-first-wasm-use defects that
    # neither a successful link nor `seid version` can (see scripts/boot-smoke.sh). Only
    # the native architecture can be booted here; the arm64 binary is gated by the
    # Linux ARM64 (static) CI job, which runs the same 8-boot gauntlet on arm64 hardware
    # against a bit-identical build of the same commit.
    - bash scripts/boot-smoke.sh build/seid-amd64 4
    # The arm64 binary boots here under emulation, so the artefact that ships is the one
    # booted. Emulated timing is not trusted to surface the gcc>=12 unwind b-tree, which
    # is why the Linux ARM64 (static) job still runs the full gauntlet on real hardware.
    - bash scripts/boot-smoke.sh build/seid-arm64 4

builds:
  # The static seid is built in Alpine (musl-native) by the `before:` hook above
  # (scripts/build-static.sh); neither Ubuntu's musl-gcc nor zig cc can produce this
  # static link on the runner. GoReleaser does NOT recompile: the `tool` shim hands it
  # that prebuilt static binary (OSS-friendly equivalent of the Pro `prebuilt` builder;
  # see scripts/goreleaser-shim.sh), so the released binary is byte-identical to the
  # static muslc `make build` (LINK_STATICALLY/muslc, ledger off). ledger is omitted from
  # the static build (needs static HID/USB; not relevant for a server seid); make/source
  # builds keep it (Makefile LEDGER_ENABLED defaults to true).
  - id: seid
    builder: go
    tool: ./scripts/goreleaser-shim.sh
    main: ./cmd/seid
    binary: seid
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: seid
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE*
      - README.md
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}'

# The GitHub Release already carries an auto-generated "What's Changed" commit list and
# a "Full Changelog" compare link: the uci reusable workflow
# sei-protocol/uci/.github/workflows/release-publish.yml creates the release with
# generate_release_notes: true, and the goreleaser job then appends to it (release.mode
# below). goreleaser was adding a second copy of both, so its changelog is disabled here
# and its footer removed.
#
# Disabling the changelog does NOT drop the release.header block below: header/footer are
# applied by goreleaser's release pipe, not the changelog pipe, so `disable` only empties
# the middle of the release body. It is also the only config-only way to get a header-only
# body: filtering out every commit still emits a bare "## Changelog" heading. Deleting
# release.footer is likewise the only way to drop the duplicate compare link, since footer
# rendering is independent of the changelog pipe.
#
# Verified against goreleaser v2.15.4 (release pipe composes the body from release.header +
# ctx.ReleaseNotes + release.footer in internal/pipe/release/body.go; changelog.disable only
# empties ctx.ReleaseNotes). uci pins the floating range `~> v2`, so if a future v2.x ever
# drops the header from a release body, re-check that composition first. The header content
# includes the checksum-verification instructions, so losing it would be user-visible.
#
# Caveat if the release args ever change: `disable` also discards flag-supplied notes
# (--release-notes / --release-header / --release-footer). uci passes a fixed
# `release --clean`, so nothing here relies on those.
changelog:
  disable: true

release:
  github:
    owner: sei-protocol
    name: sei-chain
  draft: false
  prerelease: auto
  mode: append
  name_template: '{{ .Tag }}'
  header: |
    ## Experimental Pre-built Binaries

    Pre-built **statically-linked** `seid` binaries attached below for `linux/amd64`
    and `linux/arm64`.

    Verify your download:

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```

    For Docker images, see `ghcr.io/sei-protocol/sei`.
