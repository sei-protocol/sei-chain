version: "2"
run:
  tests: false
  timeout: 10m
  build-tags:
    - codeanalysis

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
    - misspell
  settings:
    goconst:
      min-occurrences: 5
      ignore-string-values:
        - "^(consensus|error|gasUsed|get hex payload for the given inputs|kind|logsBloom|memiavl|sei-test|src|usei)$"
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
    rules:
      - linters:
          - gosec
        text: "Use of weak random number generator"
      - linters:
          - goconst
        path: "(^|/)testutil(/|$)"
      - linters:
          - goconst
        path: "(^|/)test_fixtures\\.go$"
      - linters:
          - goconst
        path: "(^|/)mocks?(/|$)"
      - linters:
          - goconst
        path: "(^|/)[^/]*mock[^/]*\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
