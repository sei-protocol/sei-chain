version: "2"
run:
  tests: false
  timeout: 10m
  build-tags:
    - codeanalysis

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
  settings:
    goconst:
      min-occurrences: 8
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      # Frozen, versioned copies of consensus-critical code are never edited for lint.
      - "^(precompiles/[^/]+|utils/helpers)/legacy/"
    rules:
      - linters:
          - gosec
        text: "Use of weak random number generator"
      # Any edit to precompiles/p256/ makes scripts/bump_version archive a new legacy copy,
      # so the deprecated elliptic/ecdsa coordinate use is silenced here rather than in source.
      - linters:
          - staticcheck
        path: "^precompiles/p256/verifier\\.go$"
        text: "SA1019"
      - linters:
          - goconst
        path: "(^|/)testutil(/|$)"
      - linters:
          - goconst
        path: "(^|/)test_(fixtures|helpers)\\.go$"
      - linters:
          - goconst
        path: "(^|/)scripts/"
      - linters:
          - goconst
        path: "(^|/)mocks?(/|$)"
      - linters:
          - goconst
        path: "(^|/)[^/]*mock[^/]*\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
