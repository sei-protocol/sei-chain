version: "2"
run:
  tests: false
  timeout: 10m
  build-tags:
    - codeanalysis

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
  settings:
    goconst:
      min-len: 3
      min-occurrences: 8
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      # Frozen, versioned copies of consensus-critical code are never edited for lint.
      - "(^|/)legacy/"
    rules:
      - linters:
          - gosec
        text: "Use of weak random number generator"
      - linters:
          - goconst
        path: "(^|/)testutil(/|$)"
      - linters:
          - goconst
        path: "(^|/)test_(fixtures|helpers)\\.go$"
      - linters:
          - goconst
        path: "(^|/)scripts/"
      - linters:
          - goconst
        path: "(^|/)mocks?(/|$)"
      - linters:
          - goconst
        path: "(^|/)[^/]*mock[^/]*\\.go$"

formatters:
  enable:
    - gofmt
    - goimports
