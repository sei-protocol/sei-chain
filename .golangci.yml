version: "2"
run:
  tests: false
  timeout: 10m
  build-tags:
    - codeanalysis

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    # goconst is deliberately not enabled: it is more noise than it is worth.
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
    rules:
      - linters:
          - gosec
        text: "Use of weak random number generator"
      # The P-256 verifier deliberately uses the deprecated elliptic/ecdsa coordinate API.
      - linters:
          - staticcheck
        path: "^precompiles/p256/verifier\\.go$"
        text: "SA1019"

formatters:
  enable:
    - gofmt
    - goimports
